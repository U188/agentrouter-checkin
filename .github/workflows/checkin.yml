name: AgentRouter Daily Check-in

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests playwright pynacl
          playwright install --with-deps chromium

      - name: Run check-in script
        env:
          USER_ID: ${{ secrets.USER_ID }}
          SESSION: ${{ secrets.SESSION }}
          SESSIONS: ${{ secrets.SESSIONS }}
          SESSION_IDS: ${{ secrets.SESSION_IDS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python app.py

      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done